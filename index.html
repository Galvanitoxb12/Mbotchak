<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configs VPN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#e3edef;--card:#f3f8f9;--ink:#10303a;--mute:#4d6c75;--line:#9fbcc4;--acc:#0f7c8a;--accink:#fff;--bad:#b4351f;--ok:#17703f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2229;--card:#16333c;--ink:#e3f0f3;--mute:#93b3bc;--line:#2f5662;--acc:#3cc2d1;--accink:#06222a;--bad:#ff8a73;--ok:#6fd49a}}
:root[data-theme="dark"]{--bg:#0e2229;--card:#16333c;--ink:#e3f0f3;--mute:#93b3bc;--line:#2f5662;--acc:#3cc2d1;--accink:#06222a;--bad:#ff8a73;--ok:#6fd49a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 18px 40px}
h1,h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0}
h1{font-size:28px;font-weight:800;line-height:1.15}
.sub{color:var(--mute);margin:6px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.app{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 10px;text-align:center;font:inherit;color:inherit;cursor:pointer}
.app:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.logo{width:76px;height:76px;margin:0 auto 10px;border:2.5px solid var(--ink);border-radius:20px;display:grid;place-items:center;font:800 32px "Bricolage Grotesque",sans-serif;letter-spacing:-2px}
.app b{display:block;font-weight:600}
.app small{color:var(--mute)}
.back{background:none;border:0;color:var(--acc);font:600 16px Figtree,sans-serif;padding:8px 0;cursor:pointer}
.head{text-align:center;margin:8px 0 18px}
.head .logo{width:96px;height:96px;font-size:40px;margin-bottom:12px}
.rows{border-top:2px solid var(--ink)}
.row{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--mute);flex:none}
.row span:last-child,.row a{text-align:right;font-weight:600}
a{color:var(--acc)}
.cfg{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.cfg b{display:block}.cfg small{color:var(--mute)}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:10px 14px;font:600 15px Figtree,sans-serif;cursor:pointer;flex:none}
h2{font-size:18px;margin:22px 0 0}
.start-wrap{display:grid;place-items:center;margin:30px 0 8px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px;text-align:center}
.res div{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;background:var(--card)}
.res small{display:block;color:var(--mute)}.res b{font-size:19px}
.note{color:var(--mute);font-size:14px;text-align:center;margin-top:12px;min-height:21px}
.empty{color:var(--mute);margin-top:10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
img.logo{display:block;border:0;border-radius:50%;object-fit:cover;background:#fff;padding:0}

.start{width:150px;height:150px;border-radius:50%;border:0;cursor:pointer;color:#fff;font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:1px;text-shadow:0 2px 3px #0008;background:radial-gradient(circle at 35% 28%,#8fd6ff 0,#1e7bd8 45%,#0b3a86 100%);box-shadow:0 0 0 8px var(--bg),0 0 0 11px #1e7bd877,0 14px 26px #0b3a8677,inset 0 -9px 16px #0007,inset 0 7px 12px #fff7;transition:background .3s,box-shadow .3s,transform .1s}
.start:active{transform:scale(.95)}
.start.run{background:radial-gradient(circle at 35% 28%,#ffa595 0,#e0301e 45%,#8a1007 100%);box-shadow:0 0 0 8px var(--bg),0 0 0 11px #e0301e88,0 14px 26px #8a100788,inset 0 -9px 16px #0007,inset 0 7px 12px #fff7;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.start.run{animation:none}}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:22px}
#fill{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1e7bd8,#3cc2d1);transition:width .15s linear}
.animal{text-align:center;font-size:84px;line-height:1.15;min-height:100px;margin-top:12px}
.animal small{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.res{grid-template-columns:1fr 1fr}
a.btn{display:inline-block;text-decoration:none}
</style>
</head>

var root=document.getElementById("app");
function expiry(c){var d=new Date(c.added+"T00:00:00");d.setDate(d.getDate()+c.days);return d}
function active(a){var now=new Date();return a.configs.filter(function(c){return expiry(c)>now}).sort(function(x,y){return expiry(x)-expiry(y)})}
function left(c){var ms=expiry(c)-new Date(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d>0?d+" j "+h+" h":h+" h"}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function home(){
 root.innerHTML='<h1>Configs VPN</h1><p class="sub">Choisissez votre application.</p><div class="grid">'+
 APPS.map(function(a){var n=active(a).length;return '<button class="app" data-id="'+a.id+'"><img class="logo" src="'+LOGOS[a.id]+'" alt="'+esc(a.name)+'"><b>'+esc(a.name)+'</b><small>'+(n?n+" config"+(n>1?"s":""):"Bientôt")+'</small></button>'}).join("")+'</div>';
 root.insertAdjacentHTML("beforeend",'<h2>Tester la vitesse</h2><div class="start-wrap"><button class="start" id="start"><span>START</span></button></div><div class="bar"><i id="fill"></i></div><div class="animal" id="animal" aria-live="polite"></div><div class="res"><div><small>Débit</small><b id="r3">—</b></div><div><small>Latence</small><b id="r1">—</b></div><div><small>Stabilité</small><b id="r2">—</b></div><div><small>Vitesse</small><b id="r4">—</b></div></div><p class="note" id="note">Activez votre VPN avec une config, puis appuyez sur START.</p>');
 root.querySelectorAll(".app").forEach(function(b){b.onclick=function(){page(b.dataset.id)}});
 document.getElementById("start").onclick=speed;
}
function page(id){
 var a=APPS.filter(function(x){return x.id===id})[0],cs=active(a);
 root.innerHTML='<button class="back" id="back">‹ Retour</button>'+
 '<div class="head"><img class="logo" src="'+LOGOS[a.id]+'" alt="'+esc(a.name)+'"><h1>'+esc(a.name)+'</h1></div>'+
 '<div class="rows"><div class="row"><span>Compatible avec</span><span>'+esc(a.compat)+'</span></div>'+
 '<div class="row"><span>Application</span><a href="'+a.store+'" target="_blank" rel="noopener">Télécharger sur Play Store</a></div>'+
 '<div class="row"><span>Expire dans</span><span>'+(cs.length?left(cs[0]):"—")+'</span></div></div>'+
 '<h2>Configurations</h2>'+
 (cs.length?cs.map(function(c,i){return '<div class="cfg"><div><b>'+esc(c.name)+'</b><small>Expire dans '+left(c)+'</small></div><a class="btn" href="'+esc(c.file)+'" download>Télécharger</a></div>'}).join(""):'<p class="empty">Aucune configuration active pour le moment.</p>')+(cs.length?'<p class="note">Après le téléchargement, importez le fichier dans l’application.</p>':'');
 document.getElementById("back").onclick=home;
 window.scrollTo(0,0);
}
async function speed(){
 var s=document.getElementById("start");
 if(s.classList.contains("run"))return;
 var $=function(i){return document.getElementById(i)},fill=$("fill"),an=$("animal"),n=$("note");
 s.classList.add("run");s.firstChild.textContent="…";
 ["r1","r2","r3","r4"].forEach(function(i){$(i).textContent="—";$(i).className=""});
 an.textContent="🔍";n.textContent="Analyse en cours…";fill.style.width="0";
 var T=3500,t0=performance.now(),bytes=0,times=[];
 var tick=setInterval(function(){fill.style.width=Math.min(100,(performance.now()-t0)/T*100)+"%"},120);
 async function worker(){while(performance.now()-t0<T){var p=performance.now();try{var r=await fetch(location.pathname+"?t="+Math.random(),{cache:"no-store"});var b=await r.arrayBuffer();bytes+=b.byteLength;times.push(performance.now()-p)}catch(e){return}}}
 await Promise.all([1,2,3,4,5,6].map(worker));
 clearInterval(tick);fill.style.width="100%";
 if(times.length<3){an.textContent="⚠️";n.textContent="Test impossible. Vérifiez votre connexion et réessayez."}
 else{
  var el=performance.now()-t0,mb=bytes*8/el/1000;
  times.sort(function(a,b){return a-b});
  var med=times[Math.floor(times.length/2)],jit=times.reduce(function(a,t){return a+Math.abs(t-med)},0)/times.length;
  var v=mb<2?["🐢","Lente","bad","Suffisant pour la messagerie et la navigation légère."]:mb<8?["🐕","Moyenne","","Correct pour la navigation et la vidéo en qualité standard."]:["🐆","Rapide","ok","Très bien pour le streaming, les jeux et les gros téléchargements."];
  an.innerHTML=v[0]+"<small class='"+v[2]+"'>"+v[1]+"</small>";
  $("r3").textContent=mb.toFixed(1)+" Mb/s";$("r1").textContent=Math.round(med)+" ms";
  var st=jit<30?["Stable","ok"]:jit<100?["Moyenne",""]:["Instable","bad"];
  $("r2").textContent=st[0];$("r2").className=st[1];
  $("r4").textContent=v[1];$("r4").className=v[2];
  n.textContent=v[3]+" Mesure de votre connexion actuelle.";
 }
 s.classList.remove("run");s.firstChild.textContent="START";
}
home();
</script>
